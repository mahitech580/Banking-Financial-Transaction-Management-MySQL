services:
  - type: web
    name: banking-financial-transaction-management
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Configure the database URL as a secret in the Render dashboard.
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_SSL
        value: "false"
      # Keep demo writes off on public deployments.
      - key: ENABLE_DEMO_TRANSFERS
        value: "false"
